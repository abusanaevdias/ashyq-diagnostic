<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">IELTS Academic Writing Task 1 report workflow</title>
  <desc id="desc">Five steps: read the prompt, select key patterns, write an overview, support it with details, and check accuracy.</desc>
  <rect width="1200" height="630" rx="36" fill="#F4F7F5"/>
  <circle cx="1090" cy="75" r="120" fill="#E4F2ED"/>
  <circle cx="85" cy="570" r="145" fill="#E7EFF5"/>
  <text x="70" y="92" fill="#18745D" font-family="Arial, sans-serif" font-size="21" font-weight="700" letter-spacing="2">IELTS ACADEMIC · WRITING TASK 1</text>
  <text x="70" y="165" fill="#173343" font-family="Arial, sans-serif" font-size="45" font-weight="700">From visual to clear report</text>
  <text x="70" y="207" fill="#526674" font-family="Arial, sans-serif" font-size="23">A practical five-step routine for your 20-minute practice</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(54 270)">
      <rect width="205" height="205" rx="22" fill="#FFFFFF" stroke="#D8E3E0" stroke-width="2"/>
      <circle cx="34" cy="36" r="21" fill="#18745D"/><text x="34" y="43" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="700">1</text>
      <text x="24" y="93" fill="#173343" font-size="24" font-weight="700">Read</text>
      <text x="24" y="130" fill="#526674" font-size="17">Prompt, units</text><text x="24" y="155" fill="#526674" font-size="17">and time period</text>
    </g>
    <g transform="translate(283 270)">
      <rect width="205" height="205" rx="22" fill="#FFFFFF" stroke="#D8E3E0" stroke-width="2"/>
      <circle cx="34" cy="36" r="21" fill="#18745D"/><text x="34" y="43" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="700">2</text>
      <text x="24" y="93" fill="#173343" font-size="24" font-weight="700">Select</text>
      <text x="24" y="130" fill="#526674" font-size="17">Main patterns</text><text x="24" y="155" fill="#526674" font-size="17">and contrasts</text>
    </g>
    <g transform="translate(512 270)">
      <rect width="205" height="205" rx="22" fill="#E8F4EF" stroke="#B8DCCE" stroke-width="2"/>
      <circle cx="34" cy="36" r="21" fill="#18745D"/><text x="34" y="43" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="700">3</text>
      <text x="24" y="93" fill="#173343" font-size="24" font-weight="700">Overview</text>
      <text x="24" y="130" fill="#526674" font-size="17">State the main</text><text x="24" y="155" fill="#526674" font-size="17">message clearly</text>
    </g>
    <g transform="translate(741 270)">
      <rect width="205" height="205" rx="22" fill="#FFFFFF" stroke="#D8E3E0" stroke-width="2"/>
      <circle cx="34" cy="36" r="21" fill="#18745D"/><text x="34" y="43" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="700">4</text>
      <text x="24" y="93" fill="#173343" font-size="24" font-weight="700">Support</text>
      <text x="24" y="130" fill="#526674" font-size="17">Add selected,</text><text x="24" y="155" fill="#526674" font-size="17">accurate details</text>
    </g>
    <g transform="translate(970 270)">
      <rect width="176" height="205" rx="22" fill="#FFFFFF" stroke="#D8E3E0" stroke-width="2"/>
      <circle cx="34" cy="36" r="21" fill="#18745D"/><text x="34" y="43" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="700">5</text>
      <text x="24" y="93" fill="#173343" font-size="24" font-weight="700">Check</text>
      <text x="24" y="130" fill="#526674" font-size="17">Numbers,</text><text x="24" y="155" fill="#526674" font-size="17">units, grammar</text>
    </g>
  </g>
  <text x="600" y="548" text-anchor="middle" fill="#173343" font-family="Arial, sans-serif" font-size="21" font-weight="700">Pattern first · useful details second · accuracy throughout</text>
</svg>
