<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Как оценивать сырой балл пробного IELTS Reading</title>
  <desc id="desc">Четыре шага: определить Academic или General Training, проверить ответы по ключу и посчитать результат из 40, сравнить его со средним ориентиром своего модуля, затем разобрать ошибки. Ориентир не гарантирует официальный band.</desc>
  <rect width="1200" height="520" rx="32" fill="#F4F7F5"/>
  <text x="600" y="74" text-anchor="middle" fill="#173343" font-family="Arial, sans-serif" font-size="40" font-weight="700">Как читать результат пробного Reading</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(40 132)">
      <rect width="248" height="286" rx="22" fill="#FFFFFF" stroke="#D8E3E0" stroke-width="2"/>
      <circle cx="38" cy="40" r="24" fill="#E8F4EF"/>
      <text x="38" y="49" text-anchor="middle" fill="#18745D" font-size="25" font-weight="700">1</text>
      <text x="24" y="112" fill="#173343" font-size="32" font-weight="700">Выберите</text>
      <text x="24" y="152" fill="#173343" font-size="32" font-weight="700">модуль</text>
      <text x="24" y="207" fill="#526674" font-size="24">Academic или</text>
      <text x="24" y="241" fill="#526674" font-size="24">General Training</text>
    </g>
    <path d="M296 274h20m-10-10 10 10-10 10" fill="none" stroke="#18745D" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(326 132)">
      <rect width="248" height="286" rx="22" fill="#FFFFFF" stroke="#D8E3E0" stroke-width="2"/>
      <circle cx="38" cy="40" r="24" fill="#E8F4EF"/>
      <text x="38" y="49" text-anchor="middle" fill="#18745D" font-size="25" font-weight="700">2</text>
      <text x="24" y="112" fill="#173343" font-size="32" font-weight="700">Посчитайте</text>
      <text x="24" y="152" fill="#173343" font-size="32" font-weight="700">ответы</text>
      <text x="24" y="217" fill="#526674" font-size="31">raw score</text>
      <text x="24" y="257" fill="#526674" font-size="28">из 40 вопросов</text>
    </g>
    <path d="M582 274h20m-10-10 10 10-10 10" fill="none" stroke="#18745D" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(612 132)">
      <rect width="248" height="286" rx="22" fill="#E8F4EF" stroke="#B8DCCE" stroke-width="2"/>
      <circle cx="38" cy="40" r="24" fill="#18745D"/>
      <text x="38" y="49" text-anchor="middle" fill="#FFFFFF" font-size="25" font-weight="700">3</text>
      <text x="24" y="112" fill="#173343" font-size="32" font-weight="700">Сверьте</text>
      <text x="24" y="152" fill="#173343" font-size="32" font-weight="700">ориентир</text>
      <text x="24" y="217" fill="#526674" font-size="25">по своему</text>
      <text x="24" y="257" fill="#526674" font-size="25">модулю IELTS</text>
    </g>
    <path d="M868 274h20m-10-10 10 10-10 10" fill="none" stroke="#18745D" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(898 132)">
      <rect width="248" height="286" rx="22" fill="#173343"/>
      <circle cx="38" cy="40" r="24" fill="#B9DCCE"/>
      <text x="38" y="49" text-anchor="middle" fill="#173343" font-size="25" font-weight="700">4</text>
      <text x="24" y="112" fill="#FFFFFF" font-size="32" font-weight="700">Разберите</text>
      <text x="24" y="152" fill="#FFFFFF" font-size="32" font-weight="700">ошибки</text>
      <text x="24" y="217" fill="#E7EFF5" font-size="25">и выберите</text>
      <text x="24" y="257" fill="#E7EFF5" font-size="25">следующий шаг</text>
    </g>
  </g>
  <text x="600" y="477" text-anchor="middle" fill="#526674" font-family="Arial, sans-serif" font-size="24">Средний ориентир помогает планировать; он не обещает конкретный результат экзамена</text>
</svg>
