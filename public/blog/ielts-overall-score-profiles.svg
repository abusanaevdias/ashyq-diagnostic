<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Одинаковый Overall IELTS при разных оценках секций</title>
  <desc id="desc">Ровный профиль 6.0, 6.0, 6.0, 6.0 и неравномерный 7.5, 7.0, 4.5, 5.0 дают среднее 6.0 и Overall 6.0.</desc>
  <rect width="1200" height="675" rx="28" fill="#F6F1E9"/>
  <text x="600" y="72" text-anchor="middle" fill="#272523" font-family="Arial, sans-serif" font-size="42" font-weight="700">Один Overall — разные профили</text>
  <text x="600" y="112" text-anchor="middle" fill="#625E5A" font-family="Arial, sans-serif" font-size="24">Пример: среднее четырёх секционных баллов</text>
  <rect x="56" y="150" width="520" height="398" rx="24" fill="#FFFFFF" stroke="#D9D2C9" stroke-width="3"/>
  <rect x="624" y="150" width="520" height="398" rx="24" fill="#FFFFFF" stroke="#D9D2C9" stroke-width="3"/>
  <rect x="56" y="150" width="520" height="12" rx="6" fill="#A33A31"/>
  <rect x="624" y="150" width="520" height="12" rx="6" fill="#A33A31"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="316" y="218" fill="#A33A31" font-size="25" font-weight="700" letter-spacing="1">РОВНЫЙ ПРОФИЛЬ</text>
    <text x="316" y="294" fill="#272523" font-size="35" font-weight="700">6.0 · 6.0 · 6.0 · 6.0</text>
    <line x1="112" y1="332" x2="520" y2="332" stroke="#D9D2C9" stroke-width="3"/>
    <text x="316" y="388" fill="#625E5A" font-size="24">Среднее</text>
    <text x="316" y="454" fill="#272523" font-size="43" font-weight="700">6.0 → Overall 6.0</text>

    <text x="884" y="218" fill="#A33A31" font-size="25" font-weight="700" letter-spacing="1">НЕРАВНОМЕРНЫЙ</text>
    <text x="884" y="294" fill="#272523" font-size="35" font-weight="700">7.5 · 7.0 · 4.5 · 5.0</text>
    <line x1="680" y1="332" x2="1088" y2="332" stroke="#D9D2C9" stroke-width="3"/>
    <text x="884" y="388" fill="#625E5A" font-size="24">Среднее</text>
    <text x="884" y="454" fill="#272523" font-size="43" font-weight="700">6.0 → Overall 6.0</text>
  </g>
  <rect x="170" y="578" width="860" height="56" rx="18" fill="#F7E7E2"/>
  <text x="600" y="614" text-anchor="middle" fill="#8E3029" font-family="Arial, sans-serif" font-size="21" font-weight="700">Порядок: Listening · Reading · Writing · Speaking</text>
</svg>
