<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">SAT Reading &amp; Writing: план по отчёту Bluebook</title>
  <desc id="desc">Карта четырёх доменов Reading and Writing с их приблизительной долей вопросов: понимание информации, структура текста, развитие идей и правила английского языка.</desc>
