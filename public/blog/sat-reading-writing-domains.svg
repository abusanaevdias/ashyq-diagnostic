  <text x="64" y="276" fill="#625E5A" font-family="Arial, sans-serif" font-size="25">Начните с домена, затем найдите навык</text>
  <text x="64" y="312" fill="#625E5A" font-family="Arial, sans-serif" font-size="25">и подберите задания нужной сложности.</text>
