<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Средние ориентиры IELTS Reading для Academic и General Training</title>
  <desc id="desc">Официальные средние ориентиры из 40 вопросов: Academic Reading — 15 ответов для Band 5, 23 для Band 6, 30 для Band 7 и 35 для Band 8; General Training Reading — 15 ответов для Band 4, 23 для Band 5, 30 для Band 6 и 35 для Band 7. Пороги могут меняться между версиями теста.</desc>
