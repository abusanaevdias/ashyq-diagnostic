<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Как выбрать формат пробного IELTS</title>
  <desc id="desc">Четыре цели и соответствующие варианты: официальные задания, знакомство с интерфейсом, полный mock четырёх навыков и короткий предварительный ориентир.</desc>
  <rect width="1200" height="820" rx="30" fill="#F6F1E9"/>
  <circle cx="1160" cy="42" r="190" fill="#A33A31" opacity="0.06"/>
  <text x="600" y="82" text-anchor="middle" fill="#A33A31" font-family="Arial, sans-serif" font-size="25" font-weight="700" letter-spacing="1.5">ПРОБНЫЙ IELTS · ШПАРГАЛКА</text>
  <text x="600" y="143" text-anchor="middle" fill="#272523" font-family="Arial, sans-serif" font-size="44" font-weight="700">Сначала определите цель</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(58 190)">
      <rect width="516" height="240" rx="26" fill="#FFFFFF" stroke="#D9D2C9" stroke-width="3"/>
      <rect width="14" height="240" rx="7" fill="#A33A31"/>
      <text x="42" y="70" fill="#A33A31" font-size="23" font-weight="700" letter-spacing="1">1 · ТИПЫ ЗАДАНИЙ</text>
      <text x="42" y="126" fill="#272523" font-size="38" font-weight="700">Sample questions</text>
      <text x="42" y="178" fill="#625E5A" font-size="28">Официальная практика и ключи</text>
    </g>
    <g transform="translate(626 190)">
      <rect width="516" height="240" rx="26" fill="#F0E8DC" stroke="#D9D2C9" stroke-width="3"/>
      <rect width="14" height="240" rx="7" fill="#7A6652"/>
      <text x="42" y="70" fill="#7A6652" font-size="23" font-weight="700" letter-spacing="1">2 · КОМПЬЮТЕРНЫЙ ФОРМАТ</text>
      <text x="42" y="126" fill="#272523" font-size="35" font-weight="700">Familiarisation test</text>
      <text x="42" y="178" fill="#625E5A" font-size="28">Навигация и экран теста</text>
    </g>
    <g transform="translate(58 462)">
      <rect width="516" height="240" rx="26" fill="#EAEFE9" stroke="#D0D9CF" stroke-width="3"/>
      <rect width="14" height="240" rx="7" fill="#456B54"/>
      <text x="42" y="70" fill="#456B54" font-size="23" font-weight="700" letter-spacing="1">3 · ПОЛНЫЙ MOCK</text>
      <text x="42" y="126" fill="#272523" font-size="38" font-weight="700">Четыре навыка</text>
      <text x="42" y="178" fill="#625E5A" font-size="27">Listening · Reading · Writing · Speaking</text>
    </g>
    <g transform="translate(626 462)">
      <rect width="516" height="240" rx="26" fill="#F7E7E2" stroke="#E6C7BE" stroke-width="3"/>
      <rect width="14" height="240" rx="7" fill="#A33A31"/>
      <text x="42" y="70" fill="#8E3029" font-size="23" font-weight="700" letter-spacing="1">4 · СТАРТОВЫЙ ОРИЕНТИР</text>
      <text x="42" y="126" fill="#272523" font-size="36" font-weight="700">Короткая диагностика</text>
      <text x="42" y="178" fill="#625E5A" font-size="27">Не заменяет полный mock IELTS</text>
    </g>
  </g>
  <text x="600" y="772" text-anchor="middle" fill="#625E5A" font-family="Arial, sans-serif" font-size="25">Выберите формат, который отвечает именно на ваш вопрос.</text>
</svg>
