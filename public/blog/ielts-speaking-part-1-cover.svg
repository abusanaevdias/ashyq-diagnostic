<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">IELTS Speaking Part 1: как отвечать без заучивания</title>
  <desc id="desc">Практическая схема: сначала ответьте на вопрос, затем добавьте одну полезную деталь и закончите мысль.</desc>
  <rect width="1200" height="675" rx="32" fill="#F4F7F5"/>
  <circle cx="1100" cy="78" r="160" fill="#E4F2ED"/>
  <circle cx="44" cy="624" r="120" fill="#E7EFF5"/>
  <text x="72" y="90" fill="#18745D" font-family="Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="2">IELTS SPEAKING PART 1</text>
  <text x="72" y="220" fill="#173343" font-family="Arial, sans-serif" font-size="80" font-weight="700">Говорите</text>
  <text x="72" y="312" fill="#173343" font-family="Arial, sans-serif" font-size="80" font-weight="700">естественно</text>
  <text x="74" y="385" fill="#526674" font-family="Arial, sans-serif" font-size="34">Ответьте по смыслу и добавьте</text>
  <text x="74" y="430" fill="#526674" font-family="Arial, sans-serif" font-size="34">одну деталь, если она к месту.</text>
  <rect x="72" y="500" width="516" height="5" rx="2.5" fill="#B8DCCE"/>
  <text x="72" y="559" fill="#173343" font-family="Arial, sans-serif" font-size="32" font-weight="700">Ответ → деталь → точка</text>
  <rect x="700" y="128" width="410" height="400" rx="36" fill="#FFFFFF" stroke="#B8DCCE" stroke-width="3"/>
  <text x="744" y="187" fill="#526674" font-family="Arial, sans-serif" font-size="40" font-weight="700">ТРИ ШАГА</text>
  <rect x="744" y="220" width="318" height="82" rx="22" fill="#E8F4EF"/>
  <circle cx="780" cy="261" r="22" fill="#18745D"/>
  <text x="780" y="270" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="25" font-weight="700">1</text>
  <text x="820" y="271" fill="#173343" font-family="Arial, sans-serif" font-size="36" font-weight="700">Ответ</text>
  <path d="M902 310v31m-12-12 12 12 12-12" fill="none" stroke="#18745D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="744" y="352" width="318" height="82" rx="22" fill="#E8F4EF"/>
  <circle cx="780" cy="393" r="22" fill="#18745D"/>
  <text x="780" y="402" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="25" font-weight="700">2</text>
  <text x="820" y="403" fill="#173343" font-family="Arial, sans-serif" font-size="36" font-weight="700">Деталь</text>
  <path d="M902 442v27m-12-12 12 12 12-12" fill="none" stroke="#18745D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="744" y="476" width="318" height="48" rx="18" fill="#173343"/>
  <text x="903" y="509" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="36" font-weight="700">Точка</text>
</svg>
