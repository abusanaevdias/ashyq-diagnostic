<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Overview and supporting evidence in IELTS Academic Writing Task 1</title>
  <desc id="desc">The overview states the main pattern. The detail paragraphs support it with selected information from the visual.</desc>
  <rect width="1200" height="630" rx="36" fill="#F4F7F5"/>
  <text x="70" y="90" fill="#18745D" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="2">IELTS ACADEMIC · TASK 1</text>
  <text x="70" y="158" fill="#173343" font-family="Arial, sans-serif" font-size="43" font-weight="700">Overview first. Evidence next.</text>
  <rect x="70" y="215" width="500" height="300" rx="26" fill="#E8F4EF" stroke="#B8DCCE" stroke-width="2"/>
  <rect x="630" y="215" width="500" height="300" rx="26" fill="#FFFFFF" stroke="#D8E3E0" stroke-width="2"/>
  <g font-family="Arial, sans-serif">
    <text x="110" y="270" fill="#18745D" font-size="19" font-weight="700" letter-spacing="1">OVERVIEW</text>
    <text x="110" y="322" fill="#173343" font-size="27" font-weight="700">What is the main pattern?</text>
    <text x="110" y="382" fill="#173343" font-size="24">Radio peaked earlier;</text>
    <text x="110" y="418" fill="#173343" font-size="24">television peaked later.</text>
    <text x="110" y="470" fill="#526674" font-size="17">A concise paraphrase of an official sample's</text>
    <text x="110" y="494" fill="#526674" font-size="17">examiner commentary; not a quotation.</text>
    <text x="670" y="270" fill="#18745D" font-size="19" font-weight="700" letter-spacing="1">SUPPORTING DETAILS</text>
    <text x="670" y="322" fill="#173343" font-size="27" font-weight="700">Which evidence supports it?</text>
    <text x="670" y="382" fill="#173343" font-size="24">Choose precise, relevant points</text>
    <text x="670" y="418" fill="#173343" font-size="24">from the visual and compare them.</text>
    <text x="670" y="470" fill="#526674" font-size="17">Check categories, values, dates</text>
    <text x="670" y="494" fill="#526674" font-size="17">and units against the task.</text>
  </g>
  <path d="M585 365h30m-11-11 11 11-11 11" fill="none" stroke="#18745D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
