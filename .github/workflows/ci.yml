name: CI

# ASHYQ release gates (CI-RELEASE-001, CI-GATES-002).
# Полный набор проверок из HANDOFF §6 на каждом PR и каждом push в main:
# lint, typecheck, validate:bank, production build, unit-проверки LMS и
# чемпионата, e2e (с CRM-ключом), check:crm, check:crm-ui, audio check,
# card-image check, LMS e2e, season e2e, аудит дизайн-токенов, axe/Lighthouse.
# Красная ветка/PR = merge блокировать настройкой branch protection
# (см. docs/CI.md, раздел «Branch protection»).

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint, typecheck, build, e2e, crm, audio, card, lms, season, tokens, a11y
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Validate question bank
        run: npm run validate:bank

      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Card image check (offline)
        run: npx tsx scripts/card-image-check.ts

      - name: LMS + season unit checks (offline)
        run: npm run check:units

      - name: E2E + CRM + audio + LMS + season + tokens + a11y (needs running site)
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          # Одноразовый ключ на прогон: сервер отдаёт CRM только с ним.
          CI_KEY="$(openssl rand -hex 32)"
          export ASHYQ_ADMIN_KEY="$CI_KEY"
          export CRM_ADMIN_KEY="$CI_KEY"
          export BASE_URL="http://127.0.0.1:3000"
          # Недостижимый webhook: e2e проверяет outbox-ledger и retry доставки лидов.
          export ASHYQ_LEAD_WEBHOOK_URL="https://127.0.0.1:9/unreachable"

          npm run start > "$RUNNER_TEMP/server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/server.pid"

          for i in $(seq 1 60); do
            if curl -sf -o /dev/null "$BASE_URL/"; then break; fi
            sleep 1
          done
          if ! curl -sf -o /dev/null "$BASE_URL/"; then
            echo "::error::Production server did not start on $BASE_URL"
            cat "$RUNNER_TEMP/server.log"
            exit 1
          fi

          npm run e2e
          npm run check:crm
          npm run check:crm-ui
          npm run e2e:audio
          # CI-GATES-002: учебный слой, чемпионат и дизайн-токены (раньше — только локально)
          npm run e2e:lms
          npm run e2e:season
          npm run check:tokens
          npm run check:a11y-perf

          kill "$(cat "$RUNNER_TEMP/server.pid")" 2>/dev/null || true

      - name: Upload screenshots and lead data on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-${{ github.run_id }}
          path: |
            screenshots/
            .data/
            artifacts/a11y-perf/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-log-${{ github.run_id }}
          path: ${{ runner.temp }}/server.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload screenshots on success
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_id }}
          path: |
            screenshots/
            artifacts/a11y-perf/
          if-no-files-found: ignore
          retention-days: 7

  lms-database:
    name: LMS Supabase RLS, Storage, and migrations
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Start local Supabase
        run: supabase start --exclude studio,imgproxy,realtime,edge-runtime,logflare,vector,postgres-meta,mailpit,supavisor

      - name: Rebuild local database from migrations
        run: supabase db reset --local

      - name: Check schema and migrations
        run: |
          npx tsx scripts/supabase-schema-check.ts
          supabase db lint --local
          supabase test db --local

      - name: Check LMS repositories and Storage RLS
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          export SUPABASE_URL="$API_URL"
          export SUPABASE_ANON_KEY="$ANON_KEY"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          npx tsx scripts/supabase-lms-check.ts
          npx tsx scripts/supabase-files-check.ts
