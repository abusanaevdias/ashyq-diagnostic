<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>01+02 age</title>
  </head>
  <body>
    <template>
      <style>
@font-face{font-family:'Manrope';src:url('assets/fonts/manrope-800-cyrillic.woff2') format('woff2');font-weight:800;font-display:block}
@font-face{font-family:'Manrope';src:url('assets/fonts/manrope-800-latin.woff2') format('woff2');font-weight:800;font-display:block}
@font-face{font-family:'Inter';src:url('assets/fonts/inter-500-cyrillic.woff2') format('woff2');font-weight:500;font-display:block}
@font-face{font-family:'Inter';src:url('assets/fonts/inter-500-latin.woff2') format('woff2');font-weight:500;font-display:block}
@font-face{font-family:'Inter';src:url('assets/fonts/inter-600-cyrillic.woff2') format('woff2');font-weight:600;font-display:block}
@font-face{font-family:'Inter';src:url('assets/fonts/inter-600-latin.woff2') format('woff2');font-weight:600;font-display:block}
@font-face{font-family:'Caveat';src:url('assets/fonts/caveat-700-cyrillic.woff2') format('woff2');font-weight:700;font-display:block}
@font-face{font-family:'Caveat';src:url('assets/fonts/caveat-700-latin.woff2') format('woff2');font-weight:700;font-display:block}

#root{position:absolute;inset:0;font-family:'Inter',sans-serif;color:#161311}
.m{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.12em;margin-bottom:-.12em}
.w{display:inline-block}


.ru{position:absolute;left:72px;right:72px;top:350px;font:600 62px/1.15 'Inter';color:#161311}
.en{position:absolute;left:72px;right:60px;top:620px;font:800 128px/1.04 'Manrope';letter-spacing:-.03em;color:#161311}
.en.sm{font-size:118px}
.t{display:inline-block;white-space:pre;vertical-align:top;position:relative;overflow:hidden;padding-bottom:.1em;margin-bottom:-.1em}
.t > .w{display:inline-block;position:relative}
.t.ls > .w{margin-left:.26em}
.t.ts > .w{margin-right:.26em}
.w > .st{position:absolute;left:-.02em;right:-.02em;top:50%;height:14px;margin-top:-4px;border-radius:7px;background:#de0b1b;transform-origin:0 50%}
.t.good > .w{color:#2e5e3a;background:#e8efe2;border-radius:18px;padding:0 .08em}
.rule{position:absolute;left:72px;right:300px;top:960px;font:700 84px/1.05 'Caveat';color:#b60916;transform:rotate(-2deg);transform-origin:0 50%}

#c1-stamp{position:absolute;left:470px;top:800px;padding:14px 30px;border:8px solid #de0b1b;border-radius:16px;color:#de0b1b;font:800 64px/1 'Manrope';letter-spacing:.08em;background:rgba(253,253,253,.9)}
#c1-r2{top:960px}

      </style>
      <div id="root" data-composition-id="c1" data-width="1080" data-height="1920">

        <div class="ru" id="c1-ru">«Мне 17 лет»</div>
        <div class="en" id="c1-en"><span class="t "><span class="w">I</span></span><span class="t good"><span class="w">’m</span></span><span class="t bad ls"><span class="w">have<i class="st"></i></span></span><span class="t ls"><span class="w">17</span></span><span class="t bad ls"><span class="w">years<i class="st"></i></span></span><span class="t "><span class="w">.</span></span></div>
        <div id="c1-stamp">КАЛЬКА</div>
        <div class="rule" id="c1-r1">звучит знакомо?</div>
        <div class="rule" id="c1-r2">возраст — через to be</div>

      </div>
      <script>

function rise(tl, scope, sel, times, dur, ease){
  const els = scope.querySelectorAll(sel);
  els.forEach((el, i) => tl.fromTo(el, {yPercent: 115, opacity: 0}, {yPercent: 0, opacity: 1, duration: dur || 0.38, ease: ease || 'expo.out'}, times[Math.min(i, times.length - 1)]));
}
function wipe(tl, el, from, to){
  tl.fromTo(el, {clipPath: 'inset(-30% 104% -30% -4%)'}, {clipPath: 'inset(-30% -4% -30% -4%)', duration: Math.max(0.3, to - from), ease: 'power1.inOut'}, from);
}

document.fonts.ready.then(() => {
const S = document.querySelector('[data-composition-id="c1"]');
const tl = gsap.timeline({ paused: true });

// width of a token measured off a canvas (pretext), so it works while the scene is still hidden
function tokWidth(el) {
  const w = el.querySelector('.w');
  const cs = getComputedStyle(w);
  const font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
  const px = parseFloat(cs.fontSize);
  const text = w.textContent;
  const pt = window.__hyperframes && window.__hyperframes.pretext;
  const tw = pt ? pt.measureNaturalWidth(pt.prepareWithSegments(text, font)) : text.length * 0.62 * px;
  const gaps = (el.classList.contains('ls') ? 0.26 : 0) + (el.classList.contains('ts') ? 0.26 : 0);
  return Math.ceil(tw + (gaps + 0.2) * px);
}
// in-place calque fix: bad tokens get struck, then collapse; good tokens grow into the gap
function fixLine(tl, scope, strikeAt, swapAt) {
  scope.querySelectorAll('.t.bad').forEach((el) => {
    const w = tokWidth(el);
    tl.fromTo(el.querySelector('.st'), {scaleX: 0}, {scaleX: 1, duration: 0.3, ease: 'power2.in'}, strikeAt);
    tl.fromTo(el.querySelector('.w'), {color: '#161311'}, {color: '#de0b1b', duration: 0.15}, strikeAt + 0.1);
    tl.fromTo(el, {maxWidth: w, opacity: 1}, {maxWidth: 0, opacity: 0, duration: 0.35, ease: 'power3.inOut', immediateRender: false}, swapAt);
  });
  scope.querySelectorAll('.t.good').forEach((el) => {
    const w = tokWidth(el);
    tl.fromTo(el, {maxWidth: 0, opacity: 0}, {maxWidth: w, opacity: 1, duration: 0.35, ease: 'power3.out'}, swapAt + 0.05);
    tl.fromTo(el.querySelector('.w'), {yPercent: 100}, {yPercent: 0, duration: 0.4, ease: 'back.out(1.8)'}, swapAt + 0.05);
  });
}

tl.fromTo('#c1-ru', {opacity: 0, y: 20}, {opacity: 1, y: 0, duration: 0.4, ease: 'power3.out'}, 0.1);
rise(tl, S, '#c1-en .t:not(.good) > .w', [0.2, 0.23, 0.55, 1.03, 1.03], 0.34);

wipe(tl, '#c1-r1', 1.97, 2.9699999999999998);
tl.fromTo('#c1-stamp', {scale: 2.2, rotation: -20, opacity: 0}, {scale: 1, rotation: -9, opacity: 1, duration: 0.22, ease: 'power4.in'}, 3.26);
tl.to(['#c1-stamp', '#c1-r1'], {opacity: 0, duration: 0.3}, 4.8100000000000005);
wipe(tl, '#c1-r2', 5.01, 6.51);
fixLine(tl, S, 6.38, 7.04);

window.__timelines['c1'] = tl;
});

      </script>
    </template>
  </body>
</html>
