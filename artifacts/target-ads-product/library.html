<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASHYQ — Бесплатная библиотека</title>
<link rel="stylesheet" href="kit.css">
<style>
.stats { position: absolute; left: 64px; right: 64px; top: 620px; display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.stat { background: var(--surface); border-radius: 36px; padding: 30px 32px; box-shadow: 0 14px 40px rgba(22, 19, 17, 0.07); }
.stat b { display: block; font: 800 96px/1 var(--display); letter-spacing: -0.04em; }
.stat span { display: block; margin-top: 10px; font: 600 30px/1.2 var(--body); color: var(--ink-soft); }
.shelf { position: absolute; left: 64px; right: 64px; top: 600px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.tile { background: var(--surface); border-radius: 30px; padding: 26px 28px; font: 800 38px/1.1 var(--display); letter-spacing: -0.01em; box-shadow: 0 10px 30px rgba(22, 19, 17, 0.06); }
.tile small { display: block; margin-top: 8px; font: 500 24px/1.2 var(--body); color: var(--ink-soft); letter-spacing: 0; }
#practice { top: 600px; }
.q { font: 800 42px/1.25 var(--display); margin-top: 22px; }
.ctx { font: 500 30px/1.45 var(--body); color: var(--ink-soft); margin-top: 16px; }
.field { margin-top: 24px; height: 96px; border: 4px solid #e2e0da; border-radius: 22px; display: flex; align-items: center; padding: 0 26px; font: 800 44px/1 var(--display); }
.btn { margin-top: 20px; height: 92px; border-radius: 999px; background: var(--dark); color: var(--on-dark); display: flex; align-items: center; justify-content: center; font: 800 36px/1 var(--display); }
.ok { margin-top: 20px; border-radius: 24px; padding: 18px 24px; background: var(--success-soft); color: var(--success); font: 600 30px/1.4 var(--body); }
</style>
</head>
<body>
<div id="stage">
  <div class="panel" id="p1" style="background:var(--bg)"></div>
  <div class="panel" id="p3" style="background:var(--blush)"></div>
  <div class="panel" id="p4" style="background:var(--dark)"></div>
  <div class="panel" id="p5" style="background:var(--bg)"></div>

  <div class="head" id="h1"></div>
  <div class="head" id="h2"></div>
  <div class="head" id="h3"></div>
  <div class="head" id="h4" style="color:var(--on-dark); top:420px; font-size:96px"></div>
  <style>#h4 .acc { color: var(--blush); }</style>

  <div class="stats" id="stats"></div>
  <div class="shelf" id="shelf"></div>

  <div class="card" id="practice">
    <div style="display:flex; justify-content:space-between; align-items:center">
      <span class="chip" style="background:var(--blush-soft); color:var(--red-deep)">Reading · пример задания</span>
      <span class="cap">3 / 12</span>
    </div>
    <p class="q">Which word in the sentence means “very old”?</p>
    <p class="ctx">“The town is famous for its ancient stone bridge.”</p>
    <div class="field" id="field"></div>
    <div class="btn" id="btn">Проверить ответ</div>
    <p class="ok" id="ok">✓ Верно · ниже — разбор и образец</p>
  </div>

  <div class="center" id="wm" style="top:600px"><img class="end-wordmark" src="../../public/brand/wordmark-ink.png" alt="ASHYQ"></div>
  <div class="center" id="cta1" style="top:800px; font-size:76px; line-height:1.05"></div>
  <p class="center end-sub" id="cta2" style="top:1040px">IELTS и Digital SAT · сразу к практике</p>
  <div class="center end-arrow" id="arrow" style="top:1130px">↓</div>

  <div class="abs spk" id="spark"></div>
</div>

<!-- Single source of truth for timing: audio.py parses this block too. -->
<script id="timeline" type="application/json">
{
  "fps": 30,
  "duration": 15,
  "scenes": [
    { "id": "hook",     "start": 0.0,  "end": 2.0 },
    { "id": "shelf",    "start": 2.0,  "end": 6.6 },
    { "id": "practice", "start": 6.6,  "end": 10.2 },
    { "id": "free",     "start": 10.2, "end": 12.6 },
    { "id": "end",      "start": 12.6, "end": 15.0 }
  ],
  "typing": [7.4, 8.2],
  "check": 8.7,
  "sfx": {
    "pop": [0.05, 2.4, 2.6, 2.8, 3.0, 3.2, 3.4, 3.6, 3.8, 13.4],
    "click": [[7.4, 8.2]],
    "chime": [8.8]
  }
}
</script>
<script src="../target-ad-15s-chat/spark/spark.js"></script>
<script src="kit.js"></script>
<script>
const TL = K.timeline();
const S = Object.fromEntries(TL.scenes.map((s) => [s.id, s]));
const { $, prog, lerp, eOut, eInOut, eBack } = K;

// Figures from the shipped library (FREE-LIBRARY-025 in HANDOFF.md, /library page copy).
const STATS = [[42, 'раздела IELTS'], [24, 'эссе Task 2'], [6, 'отчётов Task 1'], [322, 'упражнения']];
const SHELF = [['Writing Lab', 'эссе с разборами'], ['Reading', 'тексты и задания'], ['Listening', 'практика на слух'], ['Speaking', 'карточки и критерии'],
  ['Грамматика и лексика', 'языковые упражнения'], ['Digital SAT', 'вводные уроки'], ['План на 21 день', 'маршрут подготовки'], ['3 PDF', 'для офлайн-работы']];
$('stats').innerHTML = STATS.map(([n, l], i) => `<div class="stat"><b id="n${i}">${n}</b><span>${l}</span></div>`).join('');
$('shelf').innerHTML = SHELF.map(([a, b]) => `<div class="tile">${a}<small>${b}</small></div>`).join('');

K.head($('h1'), { lines: ['IELTS и SAT —', 'всё в одном месте'], acc: 'бесплатно' });
K.head($('h2'), { lines: ['Открыл —'], acc: 'и сразу практика' });
K.head($('h3'), { lines: ['Решай прямо'], acc: 'на сайте' });
K.head($('h4'), { lines: ['Без регистрации.'], acc: 'Без оплаты.' });
K.head($('cta1'), { lines: ['Бесплатная'], acc: 'библиотека' });

function seek(t) {
  K.panel($('p3'), t, S.practice.start); K.panel($('p4'), t, S.free.start); K.panel($('p5'), t, S.end.start);
  K.kt($('h1'), t, -1, S.shelf.start - 0.3);
  K.kt($('h2'), t, S.shelf.start + 0.1, S.practice.start - 0.3);
  K.kt($('h3'), t, S.practice.start + 0.1, S.free.start - 0.3);
  K.kt($('h4'), t, S.free.start + 0.3, S.end.start - 0.3);

  // hook: the numbers count up (already readable on the first frame)
  [...$('stats').children].forEach((el, i) => K.pop(el, t, -0.2 + i * 0.08, null, 0.85));
  const stOut = eInOut(prog(t, S.shelf.start - 0.3, S.shelf.start + 0.1));
  $('stats').style.transform = `translateY(${lerp(30, 0, eOut(prog(t, -0.2, 0.3))) - stOut * 1400}px)`;

  // shelf: section tiles pop in, then leave
  [...$('shelf').children].forEach((el, i) => K.pop(el, t, S.shelf.start + 0.4 + i * 0.2, S.practice.start - 0.35, 0.6));

  // practice: type the answer, press check, get feedback
  K.rise($('practice'), t, S.practice.start + 0.2, S.free.start - 0.3, 80);
  const word = 'ancient';
  const n = Math.round(word.length * prog(t, ...TL.typing));
  $('field').textContent = word.slice(0, n) + (t < TL.typing[1] && Math.floor(t * 3) % 2 ? '|' : '');
  const checked = t >= TL.check;
  $('field').style.borderColor = checked ? 'var(--success)' : '#e2e0da';
  $('field').style.color = checked ? 'var(--success)' : 'var(--ink)';
  const press = prog(t, TL.check - 0.05, TL.check + 0.05) * (1 - prog(t, TL.check + 0.1, TL.check + 0.3));
  $('btn').style.transform = `scale(${1 - 0.05 * press})`;
  K.pop($('ok'), t, TL.check + 0.1, null, 0.8);

  // end card
  const e = S.end.start, endOn = t >= e;
  ['wm', 'cta1', 'cta2', 'arrow'].forEach((id) => { $(id).style.visibility = endOn ? 'visible' : 'hidden'; });
  $('wm').style.opacity = prog(t, e + 0.05, e + 0.2);
  $('wm').style.transform = `scale(${lerp(0.8, 1, eBack(prog(t, e + 0.05, e + 0.5)))})`;
  K.kt($('cta1'), t, e + 0.45, null);
  K.rise($('cta2'), t, e + 1.1, null, 20);
  $('arrow').style.opacity = prog(t, e + 1.35, e + 1.5);
  $('arrow').style.transform = `translateY(${Math.abs(Math.sin((t - e) * 5)) * 24}px)`;

  // the spark: waves → browses the shelf → cheers at the check → big wave on the dark beat → lands on the wordmark
  const sp = $('spark');
  let x = 760, y = 1190, size = 300, pose, opts = {};
  if (t < S.shelf.start) pose = { name: 'wave', phase: t * 1.6 };
  else if (t < S.practice.start) pose = { name: 'run', phase: t };
  else if (t < S.free.start) pose = t >= TL.check ? { name: 'cheer' } : { name: 'think', lookX: -6 };
  else if (t < e) {
    size = 520; x = 280; y = lerp(1920, 820, eOut(prog(t, S.free.start + 0.2, S.free.start + 0.7))) + eInOut(prog(t, e - 0.35, e)) * 1100;
    pose = { name: 'wave', phase: t * 1.6 }; opts = { limb: '#f8f7f3' };
  } else {
    const f = eInOut(prog(t, e + 0.05, e + 0.75)), land = prog(t, e + 0.75, e + 1.15);
    x = lerp(-520, 390, f); y = lerp(200, 340, f) - Math.sin(Math.PI * f) * 130;
    pose = t < e + 0.75 ? { name: 'fly' } : { name: t < e + 1.6 ? 'cheer' : 'wave', phase: t * 1.6, squash: 1 - 0.18 * Math.sin(Math.PI * land) * (1 - land) };
  }
  y += t < 0.3 ? (1 - eOut(prog(t, 0, 0.3))) * 300 : 0;
  if (t > S.free.start - 0.35 && t < S.free.start) y += eInOut(prog(t, S.free.start - 0.35, S.free.start)) * 900;
  pose.blink = K.blink(t, [1.2, 5.1, 9.6, 14.2]);
  sp.style.width = sp.style.height = size + 'px'; sp.style.left = x + 'px'; sp.style.top = y + 'px';
  sp.style.visibility = y < 1900 ? 'visible' : 'hidden';
  K.spark(sp, pose, opts);
}
K.boot(seek);
</script>
</body>
</html>
