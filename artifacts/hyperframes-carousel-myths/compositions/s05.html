      <script>

function rise(tl, scope, sel, times, dur, ease){
  const els = scope.querySelectorAll(sel);
  els.forEach((el, i) => tl.fromTo(el, {yPercent: 115, opacity: 0}, {yPercent: 0, opacity: 1, duration: dur || 0.38, ease: ease || 'expo.out'}, times[Math.min(i, times.length - 1)]));
}
function wipe(tl, el, from, to){
  tl.fromTo(el, {clipPath: 'inset(-30% 104% -30% -4%)'}, {clipPath: 'inset(-30% -4% -30% -4%)', duration: Math.max(0.3, to - from), ease: 'power1.inOut'}, from);
}


const S = document.querySelector('[data-composition-id="s05"]');
const q = (s) => S.querySelector(s);
const qa = (s) => S.querySelectorAll(s);
const tl = gsap.timeline({ paused: true });
// number/label tickers derive text from timeline time, so seeking is deterministic
function ticker(at, dur, fn) { tl.to({v: 0}, {v: 1, duration: dur, ease: 'power2.out', onUpdate() { fn(this.targets()[0].v); }}, at); }
function labelAt(el, steps) { tl.to({}, {duration: 6.0, ease: 'none', onUpdate() { const t = this.time(); let s = ''; for (const [at, txt] of steps) if (t >= at) s = txt; if (el.textContent !== s) el.textContent = s; }}, 0); }
tl.fromTo(q('.chip-r'), {x: -40, opacity: 0}, {x: 0, opacity: 1, duration: 0.35, ease: 'power3.out'}, 0.05);
tl.fromTo(q('.wm'), {opacity: 0}, {opacity: 1, duration: 0.4}, 0.1);
tl.fromTo(qa('.pf')[4], {scaleX: 0}, {scaleX: 1, duration: 0.5, ease: 'power2.out', transformOrigin: '0% 50%'}, 0.2);

// 1) myth rises word by word, 2) red «МИФ» stamp lands, 3) marker strikes both lines, 4) fact card arrives
rise(tl, S, '.myth .w', [0.25, 0.34, 0.43, 0.52, 0.61, 0.7, 0.79], 0.36);
tl.fromTo(q('.stamp.red'), {scale: 2.4, rotation: -24, opacity: 0}, {scale: 1, rotation: -8, opacity: 1, duration: 0.26, ease: 'power4.in'}, 1.05);
qa('.myth .st').forEach((el, i) => tl.fromTo(el, {scaleX: 0}, {scaleX: 1, duration: 0.3, ease: 'power2.in'}, 1.55 + i * 0.22));
tl.to(qa('.myth .w'), {color: '#6e6d6b', duration: 0.3}, 1.7);
tl.fromTo(q('.card'), {y: 70, opacity: 0}, {y: 0, opacity: 1, duration: 0.5, ease: 'power3.out'}, 2.1);
tl.fromTo(q('.stamp.ok'), {scale: 0.4, rotation: -14, opacity: 0}, {scale: 1, rotation: -4, opacity: 1, duration: 0.4, ease: 'back.out(2.2)'}, 2.45);
rise(tl, S, '.ft .w', [2.6, 2.635, 2.67, 2.705, 2.74, 2.775, 2.81, 2.845, 2.88, 2.915, 2.95, 2.985, 3.02, 3.055, 3.09, 3.125, 3.16, 3.195, 3.23, 3.265, 3.3, 3.335, 3.37, 3.405, 3.44, 3.475, 3.51, 3.545, 3.58, 3.615, 3.65, 3.685, 3.72, 3.755, 3.79, 3.825, 3.86, 3.895, 3.93, 3.965, 4.0, 4.035, 4.07, 4.105, 4.14, 4.175, 4.21, 4.245, 4.28, 4.315, 4.35, 4.385, 4.42, 4.455, 4.49, 4.525, 4.56, 4.595, 4.63, 4.665], 0.34);

function row(cls, at, to) {
  const nums = q('.' + cls + '.nums'), calc = q('.' + cls + '.calc'), v = calc.querySelector('.v'), res = calc.querySelector('.res');
  tl.fromTo(nums, {opacity: 0, y: 14}, {opacity: 1, y: 0, duration: 0.35, ease: 'power3.out'}, at);
  tl.fromTo(calc, {opacity: 0, y: 14}, {opacity: 1, y: 0, duration: 0.35, ease: 'power3.out'}, at + 0.15);
  ticker(at + 0.2, 0.55, (p) => { v.textContent = (to * p).toFixed(2); });
  tl.fromTo(res, {scale: 0.6, opacity: 0}, {scale: 1, opacity: 1, duration: 0.4, ease: 'back.out(2.2)', immediateRender: false}, at + 0.85);
}
row('r1', 2.9, 6.25);
row('r2', 3.95, 6.75);

window.__timelines['s05'] = tl;
