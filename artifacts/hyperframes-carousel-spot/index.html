<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1440" />
    <title>ASHYQ — Найди ошибку за 3 секунды (карусель)</title>
    <!-- GSAP 3.14.2 vendored: renders must not depend on a CDN -->
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1440px; overflow: hidden; background: #f8f7f3; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f8f7f3; }
      #root > div[data-composition-src] { position: absolute; inset: 0; }
      #el-bg { z-index: 0; }
      #root > div[data-composition-src][data-track-index="1"] { z-index: 1; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1440" data-duration="42.0">
      <div id="el-bg" data-composition-id="bg" data-composition-src="compositions/bg.html" data-start="0" data-duration="42.0" data-track-index="0" data-width="1080" data-height="1440"></div>

      window.__timelines['main'] = gsap.timeline({ paused: true });

</html>
