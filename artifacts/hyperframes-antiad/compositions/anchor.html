<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>anchor</title>
  </head>
  <body>
    <template>
      <style>
@font-face{font-family:'Manrope';src:url('assets/fonts/manrope-800-cyrillic.woff2') format('woff2');font-weight:800;font-display:block}
@font-face{font-family:'Manrope';src:url('assets/fonts/manrope-800-latin.woff2') format('woff2');font-weight:800;font-display:block}
@font-face{font-family:'Inter';src:url('assets/fonts/inter-500-cyrillic.woff2') format('woff2');font-weight:500;font-display:block}
@font-face{font-family:'Inter';src:url('assets/fonts/inter-500-latin.woff2') format('woff2');font-weight:500;font-display:block}
@font-face{font-family:'Inter';src:url('assets/fonts/inter-600-cyrillic.woff2') format('woff2');font-weight:600;font-display:block}
@font-face{font-family:'Inter';src:url('assets/fonts/inter-600-latin.woff2') format('woff2');font-weight:600;font-display:block}
@font-face{font-family:'Caveat';src:url('assets/fonts/caveat-700-cyrillic.woff2') format('woff2');font-weight:700;font-display:block}
@font-face{font-family:'Caveat';src:url('assets/fonts/caveat-700-latin.woff2') format('woff2');font-weight:700;font-display:block}

#root{position:absolute;inset:0;font-family:'Inter',sans-serif;color:#161311}
.m{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.12em;margin-bottom:-.12em}
.w{display:inline-block}


#an-line{position:absolute;left:72px;top:290px;font:800 88px/1 'Manrope';letter-spacing:-.02em;white-space:nowrap}
#an-line .r{color:#de0b1b}
#an-rule{position:absolute;left:72px;right:72px;top:402px;height:5px;background:#161311;transform-origin:0 50%}
#an-count{position:absolute;right:72px;top:436px;font:800 42px/1 'Manrope';color:#6e6d6b;white-space:nowrap}
#an-count b{display:inline-block;color:#161311}
#an-count span{color:#8c8b8a}

      </style>
      <div id="root" data-composition-id="anchor" data-width="1080" data-height="1920">

        <div id="an-line"><span class="m"><span class="w r">НЕ</span></span> <span class="m"><span class="w">ПРИХОДИ,</span></span> <span class="m"><span class="w">ЕСЛИ…</span></span></div>
        <div id="an-rule"></div>
        <div id="an-count"><b id="an-n">1</b><span>/4</span></div>

      </div>
      <script>

function rise(tl, scope, sel, times, dur, ease){
  const els = scope.querySelectorAll(sel);
  els.forEach((el, i) => tl.fromTo(el, {yPercent: 115, opacity: 0}, {yPercent: 0, opacity: 1, duration: dur || 0.38, ease: ease || 'expo.out'}, times[Math.min(i, times.length - 1)]));
}
function wipe(tl, el, from, to){
  tl.fromTo(el, {clipPath: 'inset(-30% 100% -30% -4%)'}, {clipPath: 'inset(-30% -4% -30% -4%)', duration: Math.max(0.3, to - from), ease: 'power1.inOut'}, from);
}

const S = document.querySelector('[data-composition-id="anchor"]');
const tl = gsap.timeline({ paused: true });

// anchor lands once with the voice («Не приходи, если…») and never moves again
rise(tl, S, '#an-line .w', [0.2, 0.33, 1.17], 0.34);
tl.fromTo('#an-rule', {scaleX: 0}, {scaleX: 1, duration: 0.6, ease: 'power3.inOut'}, 0.3);
tl.fromTo('#an-count', {opacity: 0}, {opacity: 1, duration: 0.3}, 0.3);
// counter hard-cuts 1→2→3→4 at each scene cut (scene starts relative to the anchor slot)
const n = document.getElementById('an-n');
const cuts = [[0, '1'], [6.2, '2'], [12.1, '3'], [18.1, '4']];
tl.to({}, {duration: 24.4, ease: 'none', onUpdate() {
  const t = this.time();
  let v = '1';
  for (const [at, label] of cuts) if (t >= at) v = label;
  if (n.textContent !== v) n.textContent = v;
}}, 0);
cuts.slice(1).forEach(([at]) => tl.fromTo('#an-n', {scale: 1.5}, {scale: 1, duration: 0.3, ease: 'back.out(3)', immediateRender: false}, at));
window.__timelines['anchor'] = tl;

      </script>
    </template>
  </body>
</html>
